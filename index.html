<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trigger Webhook</title>
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;background:rgb(234,182,236);
  font-family:"IBM Plex Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;color:#2E2168}
.box{background:#fff;border-radius:14px;padding:34px 36px;text-align:center;max-width:460px;
  box-shadow:0 8px 28px rgba(46,33,104,.14)}
h1{font-size:20px;margin:0 0 20px;letter-spacing:-.01em}
button{font:inherit;font-size:16px;font-weight:600;padding:15px 34px;border-radius:10px;cursor:pointer;
  background:rgb(77,57,167);color:#fff;border:none}
button:hover{background:#3A2B80}
button:disabled{opacity:.55;cursor:not-allowed}
#msg{margin:18px 0 0;font-size:14px;min-height:20px;color:#5A46B0;line-height:1.5}
#msg.ok{color:#1C6B4A;font-weight:600}
#msg.bad{color:#8E2A2A;font-weight:600}
#how{margin:10px 0 0;font-size:12px;color:#8878CE}
a{color:rgb(77,57,167);font-size:13px}
.warn{margin:18px 0 0;padding:11px 13px;border-radius:8px;background:#FBF0DC;border:1px solid #EBD6AE;
  color:#8A5A12;font-size:12.5px;line-height:1.5;text-align:left}
code{font-family:ui-monospace,Menlo,monospace}
</style>
</head>
<body>

<div class="box">
  <h1>Trigger Make webhook</h1>
  <button id="go">Send</button>
  <p id="msg"></p>
  <p id="how"></p>
  <p><a id="manual" href="#" target="_blank" rel="noopener">Or open the URL directly in a new tab</a></p>
  <div class="warn" id="filewarn" hidden></div>
</div>

<script>
const WEBHOOK_URL = "";

const btn = document.getElementById("go");
const msg = document.getElementById("msg");
const how = document.getElementById("how");

const target = () => WEBHOOK_URL + (WEBHOOK_URL.includes("?") ? "&" : "?") + "t=" + Date.now();

/* An image request is sent by the browser regardless of CORS, and works from a
   file:// page where fetch does not. Make's reply isn't an image, so onerror
   firing is expected and still means the request was delivered. */
function beacon(url) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    let settled = false;
    const done = ok => { if (!settled) { settled = true; ok ? resolve() : reject(new Error("blocked")); } };
    img.onload = () => done(true);
    img.onerror = () => done(true);
    setTimeout(() => done(false), 8000);
    img.src = url;
  });
}

btn.addEventListener("click", async () => {
  btn.disabled = true;
  msg.className = "";
  msg.textContent = "Sending...";
  how.textContent = "";
  const url = target();
  document.getElementById("manual").href = url;

  try {
    await fetch(url, { mode: "no-cors", cache: "no-store" });
    msg.className = "ok";
    msg.textContent = "Sent - check Make's History tab";
    how.textContent = "sent by fetch";
  } catch (err) {
    try {
      await beacon(url);
      msg.className = "ok";
      msg.textContent = "Sent - check Make's History tab";
      how.textContent = "sent by image request (fetch was blocked on this page)";
    } catch (e2) {
      msg.className = "bad";
      msg.textContent = "Couldn't send from this page";
      how.textContent = "Use the link below - it always works.";
    }
  }
  btn.disabled = false;
});

(function init() {
  document.getElementById("manual").href = target();
  if (location.protocol === "file:") {
    const w = document.getElementById("filewarn");
    w.hidden = false;
    w.innerHTML = "<b>This page is open from your computer, not a web address.</b> Browsers block most " +
      "outgoing requests from <code>file://</code> pages. The button falls back to a method that still " +
      "works, but uploading this file to your site and opening it there is the reliable fix.";
  }
})();
</script>
</body>
</html>
